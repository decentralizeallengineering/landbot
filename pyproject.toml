[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "landbot"
version = "0.1.0"
description = "A local merge queue for code written by AI agents."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
landbot = "landbot:main"

[tool.setuptools]
py-modules = ["landbot"]
